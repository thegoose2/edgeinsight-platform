spring:
  application:
    name: edgeinsight-platform
  datasource:
    url: jdbc:mysql://localhost:3306/edgeinsight-platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 200472
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8081

security:
  public-paths:
    - POST:/api/v1/auth/login
    - GET:/actuator/health

logging:
  level:
    com.huidou.edgeinsight: DEBUG
    org.springframework.security: DEBUG

